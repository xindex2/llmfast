# nginx front end for the LLMFast gateway.
#
# The settings that matter are the buffering ones. nginx buffers proxied
# responses by default, which batches SSE frames and makes a perfectly good
# token stream look slow. Nothing visibly breaks -- your throughput number is
# just worse than the hardware you are paying for.

upstream llmfast {
    server 127.0.0.1:8080;
    # Keep connections warm so requests do not pay for a handshake.
    keepalive 64;
    keepalive_timeout 90s;
}

# Rate limit by source. Tune or remove once you know OpenRouter's egress ranges.
limit_req_zone $binary_remote_addr zone=api:10m rate=200r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Large prompts. Must be at least as high as the gateway's own 32MB cap.
    client_max_body_size 32m;
    client_body_timeout  60s;

    access_log /var/log/nginx/llmfast.access.log;

    location / {
        limit_req zone=api burst=400 nodelay;

        proxy_pass http://llmfast;
        proxy_http_version 1.1;

        # Empty Connection header lets the keepalive upstream pool work;
        # the default "close" would tear down a connection per request.
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Streaming. Do not change these without measuring. ---
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;
        chunked_transfer_encoding on;
        # Generations run for minutes. A short read timeout truncates them
        # mid-stream, which OpenRouter scores as a failed request.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 5s;
    }

    # The admin UI is served on :8081 and must never be proxied here.
    location /admin { return 404; }
}

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}
