<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLMFast — Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%235b8cff'/%3E%3Cpath d='M17.5 6 9 18h6l-1.5 8 8.5-12h-6z' fill='%230b0d12'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<div id="login" class="login hidden">
  <form class="login-card" id="login-form">
    <div class="brand"><span class="dot"></span> LLMFast</div>
    <h1>Admin access</h1>
    <p class="muted">Enter the admin token from <code>config.yaml</code> or <code>LLMFAST_ADMIN_TOKEN</code>.</p>
    <input type="password" id="token" placeholder="Admin token" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="err" id="login-err"></div>
  </form>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand"><span class="dot"></span> LLMFast</div>
    <nav id="nav">
      <button data-view="overview" class="active">Overview</button>
      <button data-view="models">Models</button>
      <button data-view="playground">Playground</button>
      <button data-view="benchmark">Benchmark</button>
      <button data-view="addmodel">Add Model</button>
      <button data-view="nodes">Nodes</button>
      <button data-view="backends">Backends</button>
      <button data-view="requests">Requests</button>
      <button data-view="keys">API Keys</button>
      <button data-view="modeldoc">Model Doc</button>
      <button data-view="guides">Guides</button>
    </nav>
    <div class="spacer"></div>
    <select id="range" title="Time range">
      <option value="1h">Last hour</option>
      <option value="6h">Last 6 hours</option>
      <option value="24h" selected>Last 24 hours</option>
      <option value="7d">Last 7 days</option>
      <option value="30d">Last 30 days</option>
      <option value="all">All time</option>
    </select>
    <label class="live"><input type="checkbox" id="auto" checked> Live</label>
  </header>

  <main id="main"></main>
</div>

<script src="/guides.js"></script>
<script src="/app.js"></script>
</body>
</html>
